<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon Section (left side) -->
  <g transform="translate(100, 100)">
    <!-- Main Star (Stellar) -->
    <circle cx="0" cy="0" r="50" fill="url(#bg)" opacity="0.1"/>
    <circle cx="0" cy="0" r="20" fill="url(#star)"/>
    <circle cx="0" cy="0" r="14" fill="#00D1FF" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>

    <!-- Star rays -->
    <g opacity="0.8">
      <path d="M 0,-40 L 2.5,-16 L 0,-12 L -2.5,-16 Z" fill="url(#ray)"/>
      <path d="M 28,-28 L 14,-14 L 12,-12 L 10,-14 Z" fill="url(#ray)"/>
      <path d="M 40,0 L 16,2.5 L 12,0 L 16,-2.5 Z" fill="url(#ray)"/>
      <path d="M 28,28 L 14,14 L 12,12 L 14,10 Z" fill="url(#ray)"/>
      <path d="M 0,40 L -2.5,16 L 0,12 L 2.5,16 Z" fill="url(#ray)"/>
      <path d="M -28,28 L -14,14 L -12,12 L -14,10 Z" fill="url(#ray)"/>
      <path d="M -40,0 L -16,-2.5 L -12,0 L -16,2.5 Z" fill="url(#ray)"/>
      <path d="M -28,-28 L -14,-14 L -12,-12 L -10,-14 Z" fill="url(#ray)"/>
    </g>

    <!-- Pathfinding Routes -->
    <g opacity="0.7" stroke-width="3">
      <path d="M -60,0 Q -40,-20 0,-5" stroke="url(#path1)" fill="none" stroke-dasharray="6 3"/>
      <path d="M -60,0 L -25,0" stroke="url(#path2)" fill="none" stroke-width="4"/>
      <path d="M -60,0 Q -40,20 0,5" stroke="url(#path3)" fill="none" stroke-dasharray="4 6" opacity="0.5"/>
    </g>

    <g opacity="0.6" stroke-width="3">
      <path d="M 25,0 L 60,0" stroke="url(#path2)" fill="none"/>
    </g>

    <circle cx="-60" cy="0" r="6" fill="#0A2540"/>
    <circle cx="-60" cy="0" r="3" fill="#00D1FF"/>
    <circle cx="60" cy="0" r="6" fill="#0A2540"/>
    <circle cx="60" cy="0" r="3" fill="#00D1FF"/>
  </g>

  <!-- Text Section -->
  <g transform="translate(200, 90)">
    <!-- "STELLAR" -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="url(#textGrad1)" letter-spacing="-0.5">
      STELLAR
    </text>

    <!-- "PATHFINDER" -->
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="url(#textGrad2)" letter-spacing="-0.5">
      PATHFINDER
    </text>

    <!-- Tagline -->
    <text x="0" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" letter-spacing="0.3">
      Corridor Integrity Monitor
    </text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D1FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A2540;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D1FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="ray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D1FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:0.3" />
    </linearGradient>

    <linearGradient id="path1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A2540;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#00C896;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="path2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A2540;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00D1FF;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="path3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A2540;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.6" />
    </linearGradient>

    <linearGradient id="textGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A2540;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="textGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D1FF;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
