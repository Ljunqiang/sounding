<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bgGrad)"/>

  <!-- Main Star (Stellar) -->
  <g transform="translate(64, 64)">
    <!-- Central bright star -->
    <circle cx="0" cy="0" r="18" fill="url(#starGrad)"/>
    <circle cx="0" cy="0" r="13" fill="#00D1FF" opacity="0.95"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>

    <!-- Star rays -->
    <g opacity="0.85">
      <path d="M 0,-32 L 2,-14 L 0,-10 L -2,-14 Z" fill="url(#rayGrad)"/>
      <path d="M 23,-23 L 12,-12 L 10,-10 L 8,-12 Z" fill="url(#rayGrad)"/>
      <path d="M 32,0 L 14,2 L 10,0 L 14,-2 Z" fill="url(#rayGrad)"/>
      <path d="M 23,23 L 12,12 L 10,10 L 12,8 Z" fill="url(#rayGrad)"/>
      <path d="M 0,32 L -2,14 L 0,10 L 2,14 Z" fill="url(#rayGrad)"/>
      <path d="M -23,23 L -12,12 L -10,10 L -12,8 Z" fill="url(#rayGrad)"/>
      <path d="M -32,0 L -14,-2 L -10,0 L -14,2 Z" fill="url(#rayGrad)"/>
      <path d="M -23,-23 L -12,-12 L -10,-10 L -8,-12 Z" fill="url(#rayGrad)"/>
    </g>

    <!-- Pathfinding Lines -->
    <g opacity="0.75" stroke-width="2.5" stroke-linecap="round">
      <!-- Route 1 - Top path -->
      <path d="M -40,0 Q -28,-12 0,-4" stroke="url(#p1)" fill="none" stroke-dasharray="4 2"/>
      <!-- Route 2 - Middle path (best) -->
      <path d="M -40,0 L -20,0" stroke="url(#p2)" fill="none" stroke-width="3"/>
      <!-- Route 3 - Bottom path -->
      <path d="M -40,0 Q -28,12 0,4" stroke="url(#p3)" fill="none" stroke-dasharray="2 3" opacity="0.6"/>
    </g>

    <!-- Extending paths -->
    <g opacity="0.65" stroke-width="2.5">
      <path d="M 20,0 L 40,0" stroke="url(#p2)" fill="none"/>
    </g>

    <!-- Nodes -->
    <circle cx="-40" cy="0" r="5" fill="#0A2540" opacity="0.7"/>
    <circle cx="-40" cy="0" r="2.5" fill="#00D1FF"/>
    <circle cx="40" cy="0" r="5" fill="#0A2540" opacity="0.7"/>
    <circle cx="40" cy="0" r="2.5" fill="#00D1FF"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2540;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D1FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D1FF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
    </linearGradient>

    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#00C896;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00D1FF;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.7" />
    </linearGradient>
  </defs>
</svg>
