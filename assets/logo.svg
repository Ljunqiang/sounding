<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#gradient1)" opacity="0.1"/>

  <!-- Main Star (Stellar) -->
  <g transform="translate(200, 200)">
    <!-- Central bright star -->
    <circle cx="0" cy="0" r="25" fill="url(#gradient2)"/>
    <circle cx="0" cy="0" r="18" fill="#00D1FF" opacity="0.9"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>

    <!-- Star rays -->
    <g opacity="0.8">
      <path d="M 0,-50 L 3,-20 L 0,-15 L -3,-20 Z" fill="url(#gradient3)"/>
      <path d="M 35,-35 L 18,-18 L 15,-15 L 12,-18 Z" fill="url(#gradient3)"/>
      <path d="M 50,0 L 20,3 L 15,0 L 20,-3 Z" fill="url(#gradient3)"/>
      <path d="M 35,35 L 18,18 L 15,15 L 18,12 Z" fill="url(#gradient3)"/>
      <path d="M 0,50 L -3,20 L 0,15 L 3,20 Z" fill="url(#gradient3)"/>
      <path d="M -35,35 L -18,18 L -15,15 L -18,12 Z" fill="url(#gradient3)"/>
      <path d="M -50,0 L -20,-3 L -15,0 L -20,3 Z" fill="url(#gradient3)"/>
      <path d="M -35,-35 L -18,-18 L -15,-15 L -12,-18 Z" fill="url(#gradient3)"/>
    </g>
  </g>

  <!-- Pathfinding Lines - Multiple Routes -->
  <g opacity="0.7" stroke-width="4" stroke-linecap="round">
    <!-- Route 1 - Top path (curved, good route) -->
    <path d="M 80,200 Q 120,150 200,180" stroke="url(#pathGradient1)" fill="none" stroke-dasharray="8 4"/>
    <circle cx="200" cy="180" r="5" fill="#00C896"/>

    <!-- Route 2 - Middle path (direct, best route) -->
    <path d="M 80,200 L 175,200" stroke="url(#pathGradient2)" fill="none" stroke-width="5"/>
    <circle cx="175" cy="200" r="6" fill="#00D1FF"/>

    <!-- Route 3 - Bottom path (curved, poor route) -->
    <path d="M 80,200 Q 120,250 200,220" stroke="url(#pathGradient3)" fill="none" stroke-dasharray="4 8" opacity="0.5"/>
    <circle cx="200" cy="220" r="4" fill="#F59E0B"/>
  </g>

  <!-- Extending paths from star -->
  <g opacity="0.6" stroke-width="3" stroke-linecap="round">
    <path d="M 225,200 L 320,200" stroke="url(#pathGradient2)" fill="none"/>
    <path d="M 210,185 Q 260,140 310,160" stroke="url(#pathGradient1)" fill="none" stroke-dasharray="6 3"/>
    <path d="M 210,215 Q 260,260 310,240" stroke="url(#pathGradient3)" fill="none" stroke-dasharray="4 6" opacity="0.5"/>
  </g>

  <!-- Network Nodes -->
  <g fill="#0A2540" opacity="0.6">
    <circle cx="80" cy="200" r="8"/>
    <circle cx="320" cy="200" r="8"/>
    <circle cx="310" cy="160" r="6"/>
    <circle cx="310" cy="240" r="6"/>
  </g>

  <!-- Highlight dots on nodes -->
  <g fill="#00D1FF">
    <circle cx="80" cy="200" r="4"/>
    <circle cx="320" cy="200" r="4"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D1FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A2540;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="gradient2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D1FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D1FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:0.3" />
    </linearGradient>

    <linearGradient id="pathGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A2540;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#00C896;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="pathGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A2540;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00D1FF;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="pathGradient3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A2540;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.6" />
    </linearGradient>
  </defs>
</svg>
